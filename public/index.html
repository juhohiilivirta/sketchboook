<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sketchboook — Frontpage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="mainNav">
  <a href="index.html">SKETCHBOOOK</a>
  <a href="login.html" id="loginLink">LOGIN</a>
  <a href="signup.html" id="signupLink">SIGN UP</a>
  <a href="mypage.html" id="myPageLink" style="display:none;">MY PAGE</a>
  <a href="#" id="logoutLink" style="display:none;">LOGOUT</a>
  <a href="about.html">ABOUT</a>
</nav>

  <div id="controls">
    <span id="erase">CLEAR ALL</span>
    <span id="undo">UNDO</span>
    <span id="download">DOWNLOAD (JPG)</span>
    <span id="style">STYLE: NORMAL</span>
  </div>

  <div class="slider-container" id="sprayControls">
    <label>SPRAY INTENSITY</label>
    <input type="range" id="intensity" min="10" max="200" value="50">
    <label>RADIUS</label>
    <input type="range" id="radius" min="5" max="60" value="20">
  </div>

  <canvas id="piirtokangas"></canvas>
  <div class="entry-input">
  <p id="loginNotice">
  You are not logged in. If you want to publish your drawing on your own page, please log in before drawing.
  </p>
  <button id="save">POST ENTRY</button>
</div>


<h2 style="margin-top:100px; margin-left:2%;">Latest Entries</h2>
  <div id="frontEntries"></div>

  <script src="front.js"></script>
  <script src="script.js"></script>
</body>
</html>

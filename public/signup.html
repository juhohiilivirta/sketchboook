<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up — Crapbook</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-container {
      width: 300px;
      margin: 150px auto;
      text-align: left;
    }
    .auth-container h1 {
      font-size: 18pt;
      margin-bottom: 20px;
      font-weight: normal;
    }
    .auth-container label {
      display: block;
      margin-top: 10px;
      font-size: 15pt;
    }
    .auth-container input {
      width: 100%;
      padding: 8px;
      font-size: 15pt;
      border: 1px solid #ccc;
      margin-top: 4px;
      box-sizing: border-box;
    }
    .auth-container button {
      margin-top: 20px;
      width: 100%;
      padding: 10px;
      font-size: 15pt;
      background: floralwhite;
      border: 1px solid #000;
      cursor: pointer;
    }
    .auth-container button:hover {
      background: #f0e8d8;
    }
    .auth-container p {
      margin-top: 20px;
      font-size: 14pt;
    }
    .auth-container a {
      color: #000;
      text-decoration: underline;
    }
    
    /* --- Signup / Login logo --- */
    .auth-container img {
    display: block;
    margin: 0 auto 10px auto;
    width: 100px;
    height: auto;
}

  </style>
</head>
<body>
<nav id="mainNav">
  <a href="index.html">CRAPBOOK</a>
  <a href="login.html" id="loginLink">LOGIN</a>
  <a href="signup.html" id="signupLink">SIGN UP</a>
  <a href="mypage.html" id="myPageLink" style="display:none;">MY PAGE</a>
  <a href="#" id="logoutLink" style="display:none;">LOGOUT</a>
  <a href="about.html">ABOUT</a>
</nav>

  <div class="auth-container">
    <img src="images/crapbook.png" alt="logo" width="100px" />
    <h1>Create an Account</h1>
    <label>Email</label>
    <input type="email" id="email" placeholder="Your email">
    <label>Username</label>
    <input type="text" id="username" placeholder="Your username">
    <button id="signupBtn">SIGN UP</button>
    <p>Already have an account? <a href="login.html">Login here</a></p>
  </div>

  <script>
    document.getElementById("signupBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const username = document.getElementById("username").value.trim();
      if (!email || !username) return alert("Please enter both email and username.");

      const res = await fetch("/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, username })
      });

      if (res.ok) {
        alert("Account created! Check your email for your password (or console if in test mode).");
        window.location.href = "login.html";
      } else {
        const msg = await res.text();
        alert("Signup failed: " + msg);
      }
    });
  </script>

</body>
</html>

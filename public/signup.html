<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up — Sketchboook</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="mainNav">
  <a href="index.html">SKETCHBOOOK</a>
  <a href="login.html" id="loginLink">LOGIN</a>
  <a href="signup.html" id="signupLink">SIGN UP</a>
  <a href="mypage.html" id="myPageLink" style="display:none;">MY PAGE</a>
  <a href="#" id="logoutLink" style="display:none;">LOGOUT</a>
  <a href="about.html">ABOUT</a>
</nav>

  <div class="auth-container">
    <h1>Create an Account</h1>
    <label>Email</label>
    <input type="email" id="email" placeholder="Your email">
    <label>Username</label>
    <input type="text" id="username" placeholder="Your username">
    <button id="signupBtn">SIGN UP</button>
    <p>Already have an account? <a href="login.html">Login here</a></p>
  </div>

  <script>
    document.getElementById("signupBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value.trim();
      const username = document.getElementById("username").value.trim();
      if (!email || !username) return alert("Please enter both email and username.");

      const res = await fetch("/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, username })
      });

      if (res.ok) {
        alert("Account created! Check your email for your password (or console if in test mode).");
        window.location.href = "login.html";
      } else {
        const msg = await res.text();
        alert("Signup failed: " + msg);
      }
    });
  </script>

</body>
</html>
